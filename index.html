<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reffuron</title>
  <style>
    /* Genel ayarlar */
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      font-family: "Poppins", sans-serif;
      background-color: #0d0d0d;
    }

    /* 🎥 Video arka plan */
    .background-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
      filter: brightness(55%);
    }

    /* Üst Menü */
    nav {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      padding: 20px 40px;
      background-color: rgba(0, 0, 0, 0.3);
      position: fixed;
      width: 100%;
      top: 0;
      z-index: 5;
      backdrop-filter: blur(4px);
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 25px;
      font-weight: 500;
      transition: color 0.3s;
    }

    nav a:hover {
      color: #00c3ff;
    }

    /* Sol Logo Alanı */
    .sidebar {
      position: fixed;
      top: 80px;
      left: 0;
      width: 80px;
      height: calc(100% - 80px);
      background-color: rgba(255, 255, 255, 0.05);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      padding-top: 30px;
      z-index: 4;
      backdrop-filter: blur(4px);
    }

    .game {
      position: relative;
      width: 50px;
      height: 50px;
      overflow: hidden;
      cursor: pointer;
    }

    .game img {
      width: 50px;
      height: 50px;
      border-radius: 10px;
      transition: transform 0.4s ease;
    }

    .game span {
      position: absolute;
      top: 0;
      left: 60px;
      white-space: nowrap;
      opacity: 0;
      transition: all 0.4s ease;
      color: #00c3ff;
      font-weight: 500;
    }

    .game:hover img {
      transform: translateX(80px);
    }

    .game:hover span {
      opacity: 1;
      transform: translateX(10px);
    }

    /* Ortadaki Hoşgeldiniz Alanı */
    .main-content {
      text-align: center;
      margin-top: 200px;
      color: white;
      z-index: 2;
      position: relative;
    }

    .main-content h1 {
      font-size: 3.5rem;
      color: #00c3ff;
      position: relative;
    }

    .main-content h1::after {
      content: "Reffuron";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 8rem;
      color: rgba(255, 255, 255, 0.05);
      z-index: -1;
    }

    .main-content p {
      font-size: 1.2rem;
      max-width: 600px;
      margin: 20px auto;
      opacity: 0.9;
    }

    /* 🔖 Sürüm etiketi (sağ alt köşe) */
    .version-tag {
      position: fixed;
      bottom: 15px;
      right: 20px;
      background-color: rgba(0, 0, 0, 0.4);
      color: #00c3ff;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 12px;
      z-index: 10;
      backdrop-filter: blur(4px);
      user-select: none;
      transition: opacity 0.3s;
    }

    .version-tag:hover {
      opacity: 0.7;
    }

  </style>
</head>
<body>

  <!-- 🎬 Video arka plan -->
  <video autoplay muted loop playsinline class="background-video">
    <source src="https://raw.githubusercontent.com/ReFFuRoN/reffuron.github.io/refs/heads/main/assets/background.mp4" type="video/mp4">
    Tarayıcınız video etiketini desteklemiyor.
  </video>

  <!-- Üst Menü -->
  <nav>
    <a href="index.html">Anasayfa</a>
    <a href="hakkimda.html">Hakkımda</a>
    <a href="iletisim.html">İletişim</a>
    <a href="blog.html">Blog</a>
  </nav>

  <!-- Sol logo menüsü -->
  <div class="sidebar">
    <div class="game">
      <img src="assets/images/albion.png" alt="Albion Logo">
      <span>Albion Online</span>
    </div>
    <div class="game">
      <img src="assets/images/metin2.png" alt="Metin2 Logo">
      <span>Metin2</span>
    </div>
    <div class="game">
      <img src="assets/images/riseonline.png" alt="Rise Online Logo">
      <span>Rise Online</span>
    </div>
  </div>

  <!-- Ortadaki içerik -->
  <div class="main-content">
    <h1>Hoşgeldiniz</h1>
    <p>Oyun dünyasına hoş geldiniz.  
       Blogumda oynadığım oyunlar, deneyimlerim ve videolarımı bulabilirsiniz 🎮</p>
  </div>

  <!-- Sağ alt köşedeki sürüm etiketi -->
  <div class="version-tag">
    Reffuron v1.2 — Güncellendi ✅
  </div>

</body>
</html>
