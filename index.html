<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reffuron - Oyun Dünyam</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow-x: hidden;
            background: #000000;
            color: #fff;
        }

        /* Video Arkaplan */
        .video-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
            background: #000000;
        }

        .video-background::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.7), rgba(20, 0, 0, 0.5));
            z-index: 1;
        }

        .video-background video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 120%;
            min-height: 120%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%) scale(1.1);
            object-fit: cover;
            opacity: 0.8;
        }

        /* Navigasyon */
        nav {
            position: fixed;
            top: 0;
            right: 0;
            padding: 30px 50px;
            z-index: 1000;
            display: flex;
            gap: 30px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 18px;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 25px;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        nav a:hover {
            background: rgba(138, 43, 226, 0.8);
            border-color: rgba(138, 43, 226, 1);
            transform: translateY(-3px);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.5);
        }

        /* Hoşgeldin Bölümü */
        .welcome-section {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            position: relative;
        }

        .welcome-text {
            animation: fadeInUp 1.5s ease;
        }

        .welcome-text h1 {
            font-size: 80px;
            font-weight: 900;
            color: #00ff00;
            margin-bottom: 20px;
        }

        .welcome-text h2 {
            font-size: 35px;
            color: #fff;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 191, 255, 0.5);
        }

        .welcome-text p {
            font-size: 22px;
            color: #ddd;
            margin-top: 20px;
        }

        /* Oyun Logoları Bölümü - YENİ TASARIM */
        .games-section {
            position: fixed;
            left: 50px;
            top: 120px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .game-item {
            display: flex;
            align-items: center;
            cursor: pointer;
            position: relative;
            height: 50px;
        }

        .game-logo {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.5);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            border: 3px solid rgba(255, 255, 255, 0.3);
            position: relative;
            z-index: 3;
        }

        .game-logo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .game-name-container {
            position: absolute;
            left: 55px;
            height: auto;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            background: linear-gradient(90deg, rgba(138, 43, 226, 0.95), rgba(102, 126, 234, 0.95));
            border-radius: 15px;
            padding: 12px 15px 12px 15px;
            opacity: 0;
            width: 0;
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            box-shadow: 0 10px 40px rgba(138, 43, 226, 0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            z-index: 1;
            max-width: none;
        }

        .game-name {
            font-size: 22px;
            font-weight: 700;
            line-height: 1.4;
            color: #fff;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            opacity: 0;
            transition: opacity 0.3s ease 0.2s;
        }

        .game-item:hover .game-logo {
            transform: translateX(210px) scale(1.1);
            box-shadow: 0 15px 50px rgba(138, 43, 226, 0.8);
        }

        .game-item:hover .game-name-container {
            opacity: 1;
            width: 150px;
        }

        .game-item:hover .game-name {
            opacity: 1;
        }

        /* Sayfa İçerikleri */
        .page-content {
            display: none;
            min-height: 100vh;
            padding: 120px 100px 50px 100px;
            position: relative;
            z-index: 10;
        }

        .page-content.active {
            display: block;
            animation: fadeIn 0.8s ease;
        }

        .content-box {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 50px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        .content-box h2 {
            font-size: 45px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .content-box p {
            font-size: 20px;
            line-height: 1.8;
            color: #ddd;
            margin-bottom: 20px;
        }

        /* Bağış Butonu Stili */
        .donation-section {
            margin-top: 40px;
            padding-top: 40px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .donation-buttons {
            display: flex;
            gap: 20px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .donation-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 25px;
            color: #fff;
            text-decoration: none;
            font-weight: 600;
            font-size: 18px;
            transition: all 0.3s ease;
            border: 2px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 10px 30px rgba(138, 43, 226, 0.4);
        }

        .donation-btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 40px rgba(138, 43, 226, 0.6);
        }

        /* Animasyonlar */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Parçacık Efekti */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        @media (max-width: 768px) {
            nav {
                padding: 20px;
                gap: 15px;
            }
            
            nav a {
                font-size: 14px;
                padding: 8px 15px;
            }
            
            .welcome-text h1 {
                font-size: 45px;
            }
            
            .welcome-text h2 {
                font-size: 25px;
            }
            
            .games-section {
                left: 20px;
            }
            
            .content-box {
                padding: 30px;
            }
            
            .donation-buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- Video Arkaplan -->
    <div class="video-background">
        <video autoplay muted loop playsinline>
            <source src="videos/background.mp4" type="video/mp4">
        </video>
    </div>

    <!-- Parçacık Efekti -->
    <canvas class="particles" id="particles"></canvas>

    <!-- Navigasyon -->
    <nav>
        <a href="index.html">Ana Sayfa</a>
        <a href="hakkimda.html">Hakkımda</a>
        <a href="iletisim.html">İletişim</a>
        <a href="bagis.html">💝 Destek Ol</a>
    </nav>

    <!-- Hoşgeldin Bölümü -->
    <div class="welcome-section">
        <div class="welcome-text">
            <h2>Hoş Geldiniz!</h2>
            <h1>REFFURON</h1>
            <p>🎮 Oyun Dünyama ve Kişisel Vloguma Hoş Geldiniz!</p>
        </div>
    </div>

    <!-- Oyun Logoları - GERÇEK LOGOLAR -->
    <div class="games-section">
        <div class="game-item" onclick="location.href='games/landofheroes.html'">
            <div class="game-logo">
                <img src="images/landofheroes.png" alt="Land of Heroes">
            </div>
            <div class="game-name-container">
                <div class="game-name">Land of<br>Heroes</div>
            </div>
        </div>
        
        <div class="game-item" onclick="location.href='games/albion.html'">
            <div class="game-logo">
                <img src="https://albiononline.com/assets/images/logo/logo.png" alt="Albion Online">
            </div>
            <div class="game-name-container">
                <div class="game-name">Albion<br>Online</div>
            </div>
        </div>
        
        <div class="game-item" onclick="location.href='games/minecraft.html'">
            <div class="game-logo">
                <img src="https://upload.wikimedia.org/wikipedia/en/5/51/Minecraft_cover.png" alt="Minecraft">
            </div>
            <div class="game-name-container">
                <div class="game-name">Minecraft</div>
            </div>
        </div>
    </div>
        
    <script>
        // Parçacık Animasyonu - ATEŞ EFEKTİ
        const canvas = document.getElementById('particles');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const particles = [];
        const particleCount = 100;

        for(let i = 0; i < particleCount; i++) {
            particles.push({
                x: Math.random() * canvas.width,
                y: Math.random() * canvas.height,
                vx: Math.random() * 2 - 1,
                vy: Math.random() * 2 - 1,
                size: Math.random() * 3 + 1
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(p => {
                // Sabit ateş renkleri (turuncu-kırmızı)
                const gradient = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.size * 2);
                gradient.addColorStop(0, 'rgba(255, 200, 0, 0.8)'); // Parlak turuncu
                gradient.addColorStop(0.5, 'rgba(255, 100, 0, 0.5)'); // Koyu turuncu
                gradient.addColorStop(1, 'rgba(255, 0, 0, 0)'); // Kırmızı fade
                
                ctx.fillStyle = gradient;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size * 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Rastgele hareket
                p.x += p.vx;
                p.y += p.vy;
                
                // Ekran sınırlarında sekme
                if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
            });
            
            requestAnimationFrame(animate);
        }

        animate();

        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });
    </script>
</body>
</html>
