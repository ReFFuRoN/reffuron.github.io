<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim - Reffuron</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            min-height: 100vh;
            padding: 50px;
        }

        nav {
            margin-bottom: 50px;
            display: flex;
            gap: 20px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            transition: all 0.3s ease;
        }

        nav a:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateY(-3px);
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            padding: 50px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 50px;
            margin-bottom: 30px;
        }

        p {
            font-size: 22px;
            line-height: 2;
            margin-bottom: 20px;
        }

        .social-links {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .social-links a {
            color: #fff;
            text-decoration: none;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            transition: all 0.3s ease;
            font-size: 20px;
        }

        .social-links a:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: translateX(10px);
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">← Ana Sayfa</a>
        <a href="hakkimda.html">Hakkımda</a>
        <a href="bagis.html">💝 Destek Ol</a>
    </nav>

        <p>Benimle iletişime geçmek için aşağıdaki kanalları kullanabilirsiniz:</p>
        
        <div class="social-links">
            <a href="mailto:reffuron@example.com">📧 E-posta: reffuron@example.com</a>
            <a href="#">🎮 Discord: Reffuron#0000</a>
            <a href="#">📺 YouTube: @Reffuron</a>
            <a href="#">🐦 Twitter: @Reffuron</a>
            <a href="#">📷 Instagram: @Reffuron</a>
        </div>
    </div>
